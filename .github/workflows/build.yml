name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minecraft 1.21.11 builds with Java 21, 26.x builds (and Stonecutter itself) need Java 25.
      # The last version listed becomes JAVA_HOME, so Gradle runs on 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test every Minecraft version
        run: ./gradlew test buildAndCollect --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: player-playback-jars
          path: build/libs/*/*.jar
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*/*.jar
          generate_release_notes: true
